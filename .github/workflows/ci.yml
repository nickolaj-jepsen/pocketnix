name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job pushes what it builds to the pocketnix Cachix cache, so desktops
# download the aarch64 builds instead of emulating them. Fork PRs have no
# token and only read.
jobs:
  # The guest's own AVF image, booted and switched under QEMU TCG.
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 strips unprivileged user namespaces of capabilities, and systemd-repart
      # builds the guest images in one inside the Nix sandbox (uid_map: Operation not permitted).
      - name: Let systemd-repart unshare
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: pocketnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Every system's outputs evaluate, the x86_64 ones included.
      - run: nix flake check --no-build --all-systems
      - run: nix flake check -L
      # The compositor package too: it's what GUI guests run, and desktops fetch it from the cache.
      - run: nix build -L .#pocketnix-compositor

  # After aarch64, whose push gives avf-boot's image here its aarch64 contents. With no
  # binfmt, a path missing from the cache (a fork PR can't push) fails instead of emulating.
  x86_64:
    needs: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let systemd-repart unshare
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Let the Nix sandbox use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@v16
        with:
          name: pocketnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check -L

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: pocketnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The Android SDK is unfree: keep it out of a public cache.
          pushFilter: android-sdk|androidsdk|androidenv
      # The JVM tests run against the real agent, compositor and foot; assembleRelease
      # (unsigned here) runs R8, whose rules only a release build exercises.
      - run: nix run .#gradle -- assembleDebug assembleRelease testDebugUnitTest lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
