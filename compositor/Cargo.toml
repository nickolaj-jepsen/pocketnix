[package]
name = "pocketnix-compositor"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "pocketnix-compositor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
libc = "0.2.175"
resvg = { version = "0.49", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zstd = "0.13.3"

[dev-dependencies]
wayland-client = "0.31.11"
png = "0.18"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
xkbcommon = "0.8.0"

[profile.release]
debug = "line-tables-only"
